<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Noto Serif Bengali";
      src: url("fonts/NotoSerifBengali-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Noto Serif Bengali";
      src: url("fonts/NotoSerifBengali-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: "Noto Serif Bengali";
      src: url("fonts/NotoSerifBengali-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #1a1410; }
    .stage {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #1a1410;
      font-family: "Noto Serif Bengali", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Night window behind the bound cover */
    .night {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 42% 58% at 72% 38%, rgba(196, 165, 116, 0.28) 0%, rgba(196, 165, 116, 0.08) 32%, transparent 62%),
        radial-gradient(ellipse 80% 70% at 50% 100%, rgba(26, 20, 16, 0.4) 0%, transparent 55%),
        linear-gradient(180deg, #0e0b09 0%, #1a1410 48%, #120e0c 100%);
    }

    .window-grid {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0 38%, rgba(122, 45, 50, 0.18) 38.2% 39.1%, transparent 39.2%),
        linear-gradient(180deg, transparent 0 41%, rgba(122, 45, 50, 0.16) 41.2% 42.2%, transparent 42.4%);
      opacity: 0.55;
    }

    /* Cloth-bound hardcover, landscape jacket */
    .cover {
      position: absolute;
      inset: 28px 36px;
      border-radius: 4px 10px 10px 4px;
      background: #f3ead8;
      box-shadow:
        0 0 0 1px rgba(26, 20, 16, 0.45),
        8px 18px 50px rgba(0, 0, 0, 0.55),
        inset 0 0 80px rgba(196, 165, 116, 0.07);
      overflow: hidden;
    }

    /* Wine cloth spine */
    .spine {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 54px;
      background:
        repeating-linear-gradient(
          90deg,
          #6a272c 0px,
          #7a2d32 2px,
          #8a353b 3px,
          #6e282d 5px
        );
      box-shadow: inset -10px 0 18px rgba(26, 20, 16, 0.45);
    }
    .spine::before,
    .spine::after {
      content: "";
      position: absolute;
      left: 8px; right: 10px;
      height: 7px;
      background: #1a1410;
      opacity: 0.35;
      border-radius: 1px;
    }
    .spine::before { top: 78px; }
    .spine::after { bottom: 78px; }

    .board {
      position: absolute;
      left: 54px; right: 0; top: 0; bottom: 0;
      background:
        radial-gradient(ellipse 50% 40% at 62% 22%, rgba(196, 165, 116, 0.22) 0%, transparent 70%),
        linear-gradient(180deg, #efe4cc 0%, #f3ead8 38%, #efe6d2 100%);
    }

    /* Linen / paper fiber */
    .fiber {
      position: absolute;
      inset: 0;
      opacity: 0.22;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.12  0 0 0 0 0.08  0 0 0 0 0.06  0 0 0 0.55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      mix-blend-mode: multiply;
      pointer-events: none;
    }

    /* Inner wine rule like a stamped plate */
    .plate {
      position: absolute;
      left: 86px;
      right: 42px;
      top: 36px;
      bottom: 36px;
      border: 1.5px solid rgba(122, 45, 50, 0.38);
      border-radius: 2px;
    }
    .plate::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(122, 45, 50, 0.18);
    }

    /* Café lamp */
    .lamp {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 168px;
      pointer-events: none;
    }

    /* Rain streaks on the glass */
    .rain {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      opacity: 0.55;
    }

    .lockup {
      position: absolute;
      left: 54px;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 80px;
    }

    .kicker {
      font-weight: 400;
      font-size: 18px;
      letter-spacing: 0.42em;
      color: #7a2d32;
      opacity: 0.78;
      margin-bottom: 22px;
      text-indent: 0.42em;
    }

    h1 {
      font-weight: 700;
      font-size: 72px;
      line-height: 1.18;
      color: #7a2d32;
      letter-spacing: 0.02em;
      text-wrap: balance;
      max-width: 760px;
    }
    h1 .line2 {
      display: block;
      font-size: 64px;
      font-weight: 600;
      letter-spacing: 0.12em;
      margin-top: 2px;
    }

    .rule {
      width: 168px;
      height: 1px;
      background: #7a2d32;
      opacity: 0.55;
      margin: 22px 0 16px;
    }

    .tag {
      font-weight: 400;
      font-size: 20px;
      color: #1a1410;
      opacity: 0.62;
      letter-spacing: 0.18em;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 78% 72% at 50% 48%, transparent 50%, rgba(26, 20, 16, 0.22) 100%);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="night"></div>
    <div class="window-grid"></div>
    <div class="cover">
      <div class="spine"></div>
      <div class="board">
        <div class="fiber"></div>
        <div class="plate"></div>

        <svg class="lamp" viewBox="0 0 220 168" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <line x1="110" y1="0" x2="110" y2="28" stroke="#1a1410" stroke-width="1.4" opacity="0.7"/>
          <path d="M78 28 L142 28 L154 58 L66 58 Z" fill="#7a2d32"/>
          <path d="M84 32 L136 32 L145 54 L75 54 Z" fill="#5e2227"/>
          <ellipse cx="110" cy="58" rx="44" ry="6" fill="#1a1410" opacity="0.25"/>
          <ellipse cx="110" cy="92" rx="70" ry="48" fill="#c4a574" opacity="0.28"/>
          <ellipse cx="110" cy="88" rx="36" ry="22" fill="#c4a574" opacity="0.45"/>
        </svg>

        <svg class="rain" viewBox="0 0 1200 630" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g stroke="#f3ead8" stroke-linecap="round" opacity="0.55">
            <line x1="92" y1="20" x2="80" y2="92" stroke-width="1.2"/>
            <line x1="148" y1="8" x2="134" y2="110" stroke-width="1"/>
            <line x1="210" y1="40" x2="198" y2="128" stroke-width="1.4"/>
            <line x1="268" y1="12" x2="252" y2="96" stroke-width="0.9"/>
            <line x1="330" y1="28" x2="318" y2="140" stroke-width="1.1"/>
            <line x1="392" y1="6" x2="376" y2="88" stroke-width="1.3"/>
            <line x1="455" y1="22" x2="442" y2="118" stroke-width="1"/>
            <line x1="518" y1="4" x2="504" y2="102" stroke-width="1.2"/>
            <line x1="580" y1="36" x2="568" y2="132" stroke-width="0.9"/>
            <line x1="642" y1="10" x2="626" y2="94" stroke-width="1.4"/>
            <line x1="705" y1="24" x2="692" y2="124" stroke-width="1.1"/>
            <line x1="768" y1="8" x2="754" y2="108" stroke-width="1"/>
            <line x1="830" y1="32" x2="816" y2="136" stroke-width="1.3"/>
            <line x1="892" y1="14" x2="878" y2="100" stroke-width="0.9"/>
            <line x1="955" y1="26" x2="940" y2="122" stroke-width="1.2"/>
            <line x1="1018" y1="6" x2="1004" y2="90" stroke-width="1"/>
            <line x1="1080" y1="38" x2="1066" y2="130" stroke-width="1.1"/>
            <line x1="180" y1="160" x2="168" y2="248" stroke-width="1"/>
            <line x1="420" y1="150" x2="406" y2="236" stroke-width="1.2"/>
            <line x1="860" y1="158" x2="846" y2="250" stroke-width="0.9"/>
            <line x1="1120" y1="18" x2="1106" y2="96" stroke-width="1.3"/>
            <line x1="70" y1="200" x2="58" y2="290" stroke-width="1"/>
            <line x1="980" y1="170" x2="966" y2="258" stroke-width="1.1"/>
          </g>
          <g fill="#f3ead8" opacity="0.45">
            <ellipse cx="80" cy="96" rx="1.6" ry="2.4"/>
            <ellipse cx="198" cy="132" rx="1.8" ry="2.6"/>
            <ellipse cx="376" cy="92" rx="1.4" ry="2.2"/>
            <ellipse cx="568" cy="136" rx="1.5" ry="2.3"/>
            <ellipse cx="754" cy="112" rx="1.7" ry="2.5"/>
            <ellipse cx="940" cy="126" rx="1.4" ry="2.1"/>
            <ellipse cx="1106" cy="100" rx="1.6" ry="2.4"/>
          </g>
        </svg>

        <div class="lockup">
          <div class="kicker">একটি ওয়েব উপন্যাস</div>
          <h1>
            অঘটনঘটন
            <span class="line2">পটিয়সী</span>
          </h1>
          <div class="rule"></div>
          <div class="tag">রাত · বৃষ্টি · কফিঘর</div>
        </div>
        <div class="vignette"></div>
      </div>
    </div>
  </div>
</body>
</html>
